[project]
name = "tokenrush"
version = "0.1.0"
description = "Single-stream inference engine for Qwen3.8-27B on one RTX 5090"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.14.0",
    "transformers>=5.16",
    "numpy",
    "einops",
    "safetensors",
    "huggingface-hub",
    "ninja; sys_platform == 'linux'",                   # builds the Marlin extension on first import
    "flash-linear-attention; sys_platform == 'linux'",  # the GDN chunk kernel for prefill
    "mlx>=0.32; sys_platform == 'darwin'",              # the Apple Silicon backend, tokenrush/mlx
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
bench = ["datasets", "accelerate", "matplotlib", "pytest"]
mac-bench = ["mlx-lm>=0.32; sys_platform == 'darwin'"]   # the rival and the differential reference on a Mac

[project.scripts]
tokenrush-run = "tokenrush.run:main"
tokenrush-serve = "tokenrush.serve:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tokenrush"]

[tool.uv]
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu130", marker = "sys_platform == 'linux'" }
flash-linear-attention = { git = "https://github.com/fla-org/flash-linear-attention", rev = "516143e31fce09925e6c39ac37148444bad176c4" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
